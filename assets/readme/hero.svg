<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-labelledby="t d">
  <title id="t">kr-career-skill</title>
  <desc id="d">저녁 창가 책상 위 노트북에 공고 목록이 떠 있고, 스탠드 불빛이 켜져 있어요. 퇴근하고 지친 저녁에도 이직 준비를 이어 갈 수 있게 돕는 AI 에이전트 스킬.</desc>
  <style>
    .ko{font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}
    .mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}
    .steam{animation:steam 4s ease-in-out infinite}
    .steam2{animation-delay:1.3s}
    .caret{animation:blink 1.1s steps(1) infinite}
    .lit{animation:lit 7s ease-in-out infinite}
    .tag{animation:tag 3.2s ease-in-out infinite}
    .glow{animation:glow 6s ease-in-out infinite alternate}
    @keyframes tag{0%,100%{opacity:1}50%{opacity:.45}}
    @keyframes glow{from{opacity:.75}to{opacity:1}}
    @keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes lit{0%,60%,100%{opacity:1}70%,90%{opacity:.25}}
    @media (prefers-reduced-motion:reduce){.steam,.caret,.lit,.tag,.glow{animation:none}}
  </style>
  <defs>
    <clipPath id="card"><rect width="1280" height="440" rx="24"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1D33"/>
      <stop offset="1" stop-color="#22263F"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11142A"/>
      <stop offset="1" stop-color="#2B2E52"/>
    </linearGradient>
    <radialGradient id="lamp" cx="1150" cy="250" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3B54A" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#F3B54A" stop-opacity=".08"/>
      <stop offset="1" stop-color="#F3B54A" stop-opacity="0"/>
    </radialGradient>
    <mask id="moon">
      <rect x="0" y="0" width="1280" height="440" fill="#fff"/>
      <circle cx="1112" cy="98" r="22" fill="#000"/>
    </mask>
    <clipPath id="win"><rect x="770" y="54" width="420" height="246" rx="6"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="440" fill="url(#bg)"/>

    <!-- 창문 -->
    <g clip-path="url(#win)">
      <rect x="770" y="54" width="420" height="246" fill="url(#sky)"/>
      <g fill="#EDE6D6">
        <circle cx="812" cy="88" r="1.6" opacity=".7"/>
        <circle cx="880" cy="122" r="1.2" opacity=".5"/>
        <circle cx="948" cy="76" r="1.4" opacity=".6"/>
        <circle cx="1030" cy="110" r="1.1" opacity=".5"/>
        <circle cx="1160" cy="150" r="1.3" opacity=".5"/>
        <circle cx="1100" cy="96" r="20" mask="url(#moon)" opacity=".92"/>
      </g>
      <!-- 건물 -->
      <g fill="#151831">
        <rect x="770" y="196" width="64" height="110"/>
        <rect x="840" y="162" width="52" height="144"/>
        <rect x="898" y="214" width="78" height="92"/>
        <rect x="982" y="178" width="46" height="128"/>
        <rect x="1034" y="226" width="70" height="80"/>
        <rect x="1110" y="190" width="80" height="116"/>
      </g>
      <g fill="#F3B54A">
        <rect x="782" y="212" width="8" height="10" opacity=".8"/>
        <rect x="812" y="236" width="8" height="10" opacity=".55"/>
        <rect x="852" y="178" width="8" height="10" opacity=".7"/>
        <rect x="872" y="206" width="8" height="10" class="lit"/>
        <rect x="852" y="246" width="8" height="10" opacity=".45"/>
        <rect x="914" y="230" width="8" height="10" opacity=".6"/>
        <rect x="950" y="252" width="8" height="10" opacity=".75"/>
        <rect x="994" y="194" width="8" height="10" opacity=".55"/>
        <rect x="1008" y="222" width="8" height="10" opacity=".8"/>
        <rect x="1050" y="242" width="8" height="10" opacity=".5"/>
        <rect x="1124" y="206" width="8" height="10" opacity=".7"/>
        <rect x="1160" y="232" width="8" height="10" opacity=".55"/>
      </g>
    </g>
    <rect x="770" y="54" width="420" height="246" rx="6" fill="none" stroke="#3B4170" stroke-width="6"/>
    <line x1="980" y1="54" x2="980" y2="300" stroke="#3B4170" stroke-width="4"/>

    <!-- 스탠드 불빛 -->
    <rect class="glow" width="1280" height="440" fill="url(#lamp)"/>

    <!-- 책상 -->
    <rect x="690" y="330" width="590" height="110" fill="#2C2440"/>
    <rect x="690" y="326" width="590" height="8" fill="#3C3254"/>

    <!-- 스탠드 -->
    <g>
      <rect x="1176" y="318" width="64" height="10" rx="5" fill="#4A4068"/>
      <path d="M1208 320 L1196 236 L1150 206" fill="none" stroke="#4A4068" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1124 186 L1172 222 L1150 240 Z" fill="#5A4F7C"/>
      <path d="M1128 214 Q1140 232 1156 236" fill="none" stroke="#FFD98A" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- 노트북 -->
    <g>
      <rect x="832" y="186" width="232" height="142" rx="10" fill="#0F1124" stroke="#4A4F80" stroke-width="3"/>
      <rect x="846" y="200" width="204" height="114" rx="4" fill="#F4EEE2"/>
      <!-- 화면 속 공고 목록 -->
      <g class="mono" font-size="10" fill="#7A7268">
        <text x="856" y="216">$ career.py search</text>
      </g>
      <rect x="972" y="207" width="6" height="11" fill="#1A1D33" class="caret"/>
      <g>
        <rect x="854" y="226" width="188" height="24" rx="4" fill="#FBE3B2"/>
        <circle cx="866" cy="238" r="5" fill="#D98A1E"/>
        <rect x="878" y="232" width="90" height="5" rx="2.5" fill="#3A3346"/>
        <rect x="878" y="241" width="56" height="4" rx="2" fill="#9A8F84"/>
        <rect class="tag" x="1006" y="233" width="28" height="10" rx="5" fill="#D98A1E"/>
        <circle cx="866" cy="264" r="5" fill="#B9B0A3"/>
        <rect x="878" y="258" width="104" height="5" rx="2.5" fill="#3A3346"/>
        <rect x="878" y="267" width="64" height="4" rx="2" fill="#9A8F84"/>
        <circle cx="866" cy="290" r="5" fill="#B9B0A3"/>
        <rect x="878" y="284" width="78" height="5" rx="2.5" fill="#3A3346"/>
        <rect x="878" y="293" width="48" height="4" rx="2" fill="#9A8F84"/>
      </g>
      <path d="M812 328 H1084 L1074 340 H822 Z" fill="#4A4F80"/>
    </g>

    <!-- 머그컵 -->
    <g>
      <path d="M1098 290 h34 v28 a8 8 0 0 1 -8 8 h-18 a8 8 0 0 1 -8 -8 Z" fill="#E9E1D2"/>
      <path d="M1132 296 a9 9 0 0 1 0 18" fill="none" stroke="#E9E1D2" stroke-width="4"/>
      <path class="steam" d="M1108 282 q-5 -8 0 -14 q5 -6 0 -14" fill="none" stroke="#E9E1D2" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
      <path class="steam steam2" d="M1121 282 q-5 -8 0 -14 q5 -6 0 -14" fill="none" stroke="#E9E1D2" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
    </g>

    <!-- 글 -->
    <text x="72" y="118" class="ko" font-size="17" font-weight="700" letter-spacing="2" fill="#F3B54A">취업·이직 AI 에이전트 스킬</text>
    <text x="68" y="196" class="mono" font-size="62" font-weight="700" fill="#F4EEE2">kr-career-skill</text>
    <text x="72" y="254" class="ko" font-size="27" font-weight="600" fill="#F4EEE2">퇴근하고 지친 저녁에도,</text>
    <text x="72" y="292" class="ko" font-size="27" font-weight="600" fill="#F4EEE2">이직 준비를 이어 갈 수 있게</text>
    <line x1="72" y1="330" x2="132" y2="330" stroke="#F3B54A" stroke-width="3"/>
    <text x="72" y="368" class="ko" font-size="17" fill="#A9ACCB">맞춤 공고 · 회사 분석 · 자소서 초안 · 매일 새 공고 알림</text>
  </g>
</svg>
